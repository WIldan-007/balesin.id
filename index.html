<!doctype html>
<html lang="id">
  <head>
    <script>
      (function() {
        try {
          var proto = window;
          var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
          while (!desc && proto) {
            proto = Object.getPrototypeOf(proto);
            if (proto) desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
          }
          if (desc && desc.get && !desc.set) {
            var originalFetch = desc.get.call(window);
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(v) { originalFetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
